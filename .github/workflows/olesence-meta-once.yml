name: One isolated PageView (explicit branch creation only)
on:
  create:
  push:
    branches: [olesence-meta-live-preflight-20261120]
permissions:
  contents: read
concurrency:
  group: olesence-meta-live-once-20261120
  cancel-in-progress: false
jobs:
  preflight:
    if: github.repository == 'Slobo99/olesence-test' && github.actor == 'Slobo99' && github.triggering_actor == 'Slobo99' && github.run_attempt == 1 && ((github.event_name == 'push' && github.ref == 'refs/heads/olesence-meta-live-preflight-20261120') || (github.event_name == 'create' && github.event.ref_type == 'branch' && github.event.ref == 'olesence-meta-live-once-20261120'))
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    defaults:
      run:
        working-directory: meta-live-candidate
    steps:
      - name: Extract checksum-validated reviewed source
        working-directory: ${{ github.workspace }}
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib,io,tarfile
          data=base64.b64decode('',validate=True)
          assert hashlib.sha256(data).hexdigest()=='83216eb94d34321549b8570507ee04d4779b52e570f8026cdcd35b8c14fa2606','Payload checksum mismatch'
          expected=['meta-live-candidate/package.json', 'meta-live-candidate/run.mjs', 'meta-live-candidate/cli.mjs', 'meta-live-candidate/transport.mjs', 'meta-live-candidate/source-hashes.json', 'meta-live-candidate/public/meta-bridge.js', 'meta-live-candidate/public/meta-protocol.js', 'meta-live-candidate/src/meta-frame.mjs', 'meta-live-candidate/test/transport.test.mjs']
          with tarfile.open(fileobj=io.BytesIO(gzip.decompress(data))) as archive:
            members=archive.getmembers()
            assert sorted(m.name for m in members)==sorted(expected)
            assert all(m.isfile() and not m.issym() and not m.islnk() for m in members)
            archive.extractall(filter='data')
          print('Reviewed source checksum verified')
          PY
      - run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - run: npm test
      - name: Sandbox preflight, no Pixel secret or SDK
        env:
          ALLOW_META_TEST: '0'
        run: |
          node --input-type=module <<'JS'
          import {chromium}from 'playwright';
          const b=await chromium.launch({channel:'chrome',headless:true,chromiumSandbox:true,proxy:{server:'http://127.0.0.1:9'},args:['--proxy-bypass-list=<-loopback>']});
          try{const c=await b.newContext({serviceWorkers:'block'});await c.route('**/*',r=>r.abort());await c.routeWebSocket('**/*',ws=>ws.close());const p=await c.newPage();await p.goto('about:blank');console.log('Stock sandbox preflight passed; no SDK loaded');}finally{await b.close()}
          JS
  once:
    needs: preflight
    if: github.event_name == 'create' && github.repository == 'Slobo99/olesence-test' && github.event.ref_type == 'branch' && github.event.ref == 'olesence-meta-live-once-20261120' && github.actor == 'Slobo99' && github.triggering_actor == 'Slobo99' && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    defaults:
      run:
        working-directory: meta-live-candidate
    steps:
      - name: Extract checksum-validated reviewed source
        working-directory: ${{ github.workspace }}
        run: |
          python3 - <<'PY'
          import base64,gzip,hashlib,io,tarfile
          data=base64.b64decode('',validate=True)
          assert hashlib.sha256(data).hexdigest()=='83216eb94d34321549b8570507ee04d4779b52e570f8026cdcd35b8c14fa2606','Payload checksum mismatch'
          expected=['meta-live-candidate/package.json', 'meta-live-candidate/run.mjs', 'meta-live-candidate/cli.mjs', 'meta-live-candidate/transport.mjs', 'meta-live-candidate/source-hashes.json', 'meta-live-candidate/public/meta-bridge.js', 'meta-live-candidate/public/meta-protocol.js', 'meta-live-candidate/src/meta-frame.mjs', 'meta-live-candidate/test/transport.test.mjs']
          with tarfile.open(fileobj=io.BytesIO(gzip.decompress(data))) as archive:
            members=archive.getmembers()
            assert sorted(m.name for m in members)==sorted(expected)
            assert all(m.isfile() and not m.issym() and not m.islnk() for m in members)
            archive.extractall(filter='data')
          print('Reviewed source checksum verified')
          PY
      - run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Exactly one application attempt, sanitized output only
        env:
          META_PIXEL_ID: ${{ secrets.OLESENCE_ONE_SHOT_PIXEL_ID }}
          ALLOW_META_TEST: '1'
        run: node cli.mjs
