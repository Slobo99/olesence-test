# Files only: create these NEW temporary resources only after explicit approval.
previews:
  generation: 'off'
databases:
  - name: olesence-cod-test-db-20261017
    databaseName: olesence_cod_test_20261017
    user: olesence_cod_test
    plan: free
    region: oregon
    postgresMajorVersion: '18'
    ipAllowList: []
services:
  - type: web
    name: olesence-cod-test-runner-20261017
    runtime: node
    plan: free
    region: oregon
    rootDir: Oleosence-PostgreSQL-test-setup-compact/isolated-cod-test
    autoDeployTrigger: 'off'
    buildCommand: node prepare-source.mjs && cd app && npm ci --ignore-scripts --no-audit --no-fund && npm run check && cd .. && node --test guard.test.mjs
    startCommand: node run.mjs
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: ISOLATED_COD_TEST
        value: approved-synthetic-only
      - key: EXPECTED_TEST_DATABASE
        value: olesence_cod_test_20261017
      - key: EXPECTED_TEST_HOST
        fromDatabase:
          name: olesence-cod-test-db-20261017
          property: host
      - key: TEST_DATABASE_URL
        fromDatabase:
          name: olesence-cod-test-db-20261017
          property: connectionString
